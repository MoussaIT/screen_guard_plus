name: screen_guard_plus
description: Native screen recording/screenshot shielding for iOS + FLAG_SECURE on Android.
version: 0.0.2
homepage:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.moussait.screen_guard_plus
        pluginClass: ScreenGuardPlusPlugin
      ios:
        pluginClass: ScreenGuardPlusPlugin
